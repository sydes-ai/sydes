[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sydes"
version = "0.2.0b5"
description = "CLI-first tool that traces API flows and verifies backend code changes, using code-graph evidence and AI reasoning to show what could be affected and what's still unverified."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sydes Contributors" }
]
dependencies = [
  "anthropic>=0.102.0",
  "codebase-memory-mcp==0.10.8",
  "openai>=2.36.0",
  "pydantic>=2.7,<3.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
sydes = "sydes.cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]
# Only needed for SYDES_LAYER2_GENERIC_EDGES on non-Python files (TS/Java/Go).
# Python's own Layer 2 support uses the stdlib `ast` module and needs none of
# this; imported lazily in layer2_treesitter_bridge.py so a Python-only
# install is entirely unaffected by this extra being absent.
treesitter = [
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sydes"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
