[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sydes"
version = "0.4.0"
description = "CLI-first tool that traces API flows and verifies backend code changes, using code-graph evidence and AI reasoning to show what could be affected and what's still unverified."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sydes Contributors" }
]
dependencies = [
  "anthropic>=0.102.0",
  "codebase-memory-mcp==0.11.0",
  # Runtime evidence (diffgenome-runtime/1). DiffGenome needs Python 3.12+ (sys.monitoring);
  # on 3.11 Sydes runs without it and reports the behavioral map as unavailable.
  "diffgenome>=0.1.11; python_version >= '3.12'",
  "openai>=2.36.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0",  # .sydes.yml (runtime overrides)
  # Structural parser for deterministic Track A analysis (dispatch composition on TS,
  # Layer 2 generic edges on TS/Java/Go): required so a plain install is never silently partial.
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.2",
  "typer>=0.12,<1.0",
]

[project.scripts]
sydes = "sydes.cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]
# Kept so existing `sydes[treesitter]` installs keep resolving; tree-sitter is
# now a required dependency (see [project].dependencies).
treesitter = [
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sydes"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
